namespace: newrelic
name: com.newrelic.infrastructure.nri_postgresql
version: 0.1.0
platform: host
operating_system: windows
protocol_version: "1.0"
variables:
  config:
    description: "nri-postgresql integration YAML consumed by the infra-agent"
    type: yaml
    required: true
  custom_queries:
    description: "nri-postgresql custom query files"
    type: string_map
    required: false
    default: {}
  version:
    description: "Agent version"
    type: string
    required: true
  oci:
    repository:
      description: "OCI repository name for nri-postgresql"
      type: string
      required: false
      default: newrelic/nri-postgresql-artifacts
      variants:
        ac_config_field: "oci_repository_urls"
        values: [ "newrelic/nri-postgresql-artifacts" ]
deployment:
  packages:
    nri-postgresql:
      download:
        oci:
          repository: ${nr-var:oci.repository}
          version: ${nr-var:version}
          public_key_url: https://publickeys.newrelic.com/g/agent-control-oci/global/nri-postgresql/jwks.json
  shared_filesystem:
    infra-agent-ohi-configs:
      kind: dir
      entries:
        nri-postgresql.yaml:
          kind: file
          text: |
            ${nr-var:config}
    infra-agent-ohi-binaries:
      kind: dir
      entries:
        nri-postgresql.exe:
          kind: file
          copy_from_file: ${nr-sub:packages.nri-postgresql.dir}\\nri-postgresql.exe
  # Allows setting up additional files to be used as `CUSTOM_METRICS_CONFIG` on nri-postgresql configuration
  # It can be references as follows in values:
  #
  # ```
  # custom_queries:
  #   postgresql-custom-query.yaml: |
  #     <CUSTOM-QUERIES-CONTENT>
  #
  # config:
  #    integrations:
  #      - name: nri-postgresql
  #        env:
  #          # ...
  #          CUSTOM_METRICS_CONFIG: ${nr-path:agent_dir}\custom_queries\postgresql-custom-query.yaml
  # ```
  filesystem:
    custom_queries:
      kind: dir_content_from_map
      source: ${nr-var:custom_queries}
